spring.application.name=brasil-market
server.port=8080
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
spring.datasource.url=${BRASILDROP_DB_URL:jdbc:h2:file:./data/brasildrop;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${BRASILDROP_DB_USER:sa}
spring.datasource.password=${BRASILDROP_DB_PASSWORD:}
spring.h2.console.enabled=false
server.error.include-message=never
