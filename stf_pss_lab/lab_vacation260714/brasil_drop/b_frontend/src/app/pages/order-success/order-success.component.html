<main class="content receipt-page">
  <header class="no-print receipt-page-heading">
    <p class="receipt-eyebrow">BRASIL DROP · MEUS PEDIDOS</p>
    <h1>Seu comprovante de compra</h1>
    <p>Consulte os detalhes e imprima uma cópia sempre que precisar.</p>
  </header>
  <p *ngIf="loading" role="status" class="no-print">Carregando comprovante…</p>
  <section *ngIf="error" role="alert" class="alert no-print">
    <p>{{ error }}</p>
    <a *ngIf="unauthorized" class="primary link-button" routerLink="/login"
       [queryParams]="{ returnUrl: returnUrl }">Entrar na minha conta</a>
    <button *ngIf="!unauthorized" type="button" (click)="retry()">Tentar novamente</button>
  </section>
  <ng-container *ngIf="order">
    <div class="receipt-actions no-print">
      <button type="button" class="primary" (click)="print()">Imprimir comprovante</button>
      <a routerLink="/pedidos">Meus pedidos</a>
      <a routerLink="/">Continuar comprando</a>
    </div>
    <app-order-receipt [order]="order"></app-order-receipt>
  </ng-container>
  <a *ngIf="!order && !loading" class="no-print" routerLink="/pedidos">Voltar para Meus pedidos</a>
</main>
