<header class="topbar">
  <a class="brand" routerLink="/">brasil<span>drop</span></a>
  <nav class="nav">
    <a routerLink="/">Produtos</a>
    <a routerLink="/pedidos">Meus pedidos</a>
  </nav>
  <form class="search" (submit)="search(); $event.preventDefault()">
    <input type="search" [(ngModel)]="query" name="q" placeholder="Chuteiras, camisas ou marcas">
    <button type="submit" aria-label="Buscar">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </form>
  <div class="account">

    <div class="font-controls" aria-label="Tamanho da fonte">
      <button class="font-btn" (click)="fontSize.increase()" [disabled]="!fontSize.canIncrease" aria-label="Aumentar fonte">A+</button>
      <button class="font-btn" (click)="fontSize.decrease()" [disabled]="!fontSize.canDecrease" aria-label="Diminuir fonte">A-</button>
    </div>

    <a class="icon-btn" routerLink="/wishlist" aria-label="Favoritos">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span class="icon-badge">{{ wishlistCount }}</span>
    </a>

    <a class="icon-btn" routerLink="/cart" aria-label="Carrinho">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="icon-badge">{{ cartCount }}</span>
    </a>

    <a *ngIf="!auth.isLoggedIn" routerLink="/login" class="nav-link">Entrar</a>

    <div class="user-menu-wrapper" *ngIf="auth.isLoggedIn">
      <button class="user-avatar-btn" (click)="toggleUserMenu()" aria-label="Menu do usuario">
        {{ userInitial }}
      </button>

      <div class="user-dropdown" *ngIf="userMenuOpen">
        <div class="user-dropdown-header">
          <div class="user-dropdown-avatar">{{ userInitial }}</div>
          <span class="user-dropdown-name">{{ userName }}</span>
        </div>
        <div class="user-dropdown-actions">
          <button class="user-dropdown-btn" type="button">Conta</button>
          <button class="user-dropdown-btn" type="button">Configuracoes</button>
          <button class="user-dropdown-btn user-dropdown-btn-exit" type="button" (click)="logout()">Sair</button>
        </div>
      </div>
    </div>

  </div>
</header>
